<body>
<nav class="nav">

<div class="page">
  <div class="card sbar">
    <div><h4>Données commandes VN</h4><p id="sst">Connexion…</p></div>

<script>
const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const VD=[{nom:'FLORENT',i:'FL',c:'#1B2D5B'},{nom:'SAMUEL',i:'SA',c:'#2D7A4F'},{nom:'ALAN',i:'AL',c:'#C0392B'}];
const now=new Date();
let S={mois:now.getMonth(),annee:now.getFullYear(),v:VD.map(v=>({...v,ventes:[]}))};
let orders=[];
const SB_URL='https://hafvirtqdccehjqljnlo.supabase.co',SB_KEY='sb_publishable_YrmSWYjCqkpP4gZE3OPQXA_NHGK7anj',SB_TABLE='Commande%20VN',SYNC_MS=8000;
const SB_H={'apikey':SB_KEY,'Content-Type':'application/json'};
async function sb(q,opt){const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+q,{headers:SB_H,...opt});if(!r.ok)throw new Error(r.status+' '+(await r.text()));const t=await r.text();return t?JSON.parse(t):null;}
const $=id=>document.getElementById(id);
const eur=n=>Math.round(n||0).toLocaleString('fr-FR')+' €';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAnn=x=>x.annule===true;
const inM=x=>x.mois===S.mois&&x.annee===S.annee;
const vCde=vi=>S.v[vi].ventes.filter(x=>!isAnn(x)&&inM(x));
const vAnn=vi=>S.v[vi].ventes.filter(x=>isAnn(x)&&inM(x));
const allCde=()=>S.v.flatMap((v,i)=>vCde(i));
function chMois(d){S.mois+=d;if(S.mois<0){S.mois=11;S.annee--;}if(S.mois>11){S.mois=0;S.annee++;}render();}
async function resetAll(){
  if(!confirm('Effacer TOUTES les commandes pour tout le monde ?'))return;
  try{await sb('?id=gt.0',{method:'DELETE'});await refresh();}catch(e){alert('Suppression impossible : '+e.message);}
}
function rTop(){
  $('moisLbl').textContent=MN[S.mois]+' '+S.annee;
}
const OPT=[['fi','FI'],['mad','MAD'],['coyote','COYOTE'],['protech','PROTECH'],['bulbee','BULBEE'],['euro','EURODATA'],['reprise','REPRISES']];
const vOrd=()=>S.v.map((_,i)=>i).sort((a,b)=>S.v[a].nom.localeCompare(S.v[b].nom,'fr'));
function rCards(){
  $('vgrid').innerHTML=vOrd().map(i=>{const v=S.v[i];
    const vm=vCde(i),mg=vm.reduce((s,x)=>s+(x.marge||0),0),g=k=>vm.filter(x=>x[k]).length,gt=k=>vm.filter(x=>(x.type||'VN')===k).length;
    const ca=vm.filter(x=>x.fi).reduce((s,x)=>s+(x.ca||0),0);
    const t=(val,l,cls='')=>`<div class="vs"><div class="vsv ${cls}">${val}</div><div class="vsl">${l}</div></div>`;
    return`<div class="vc"><div class="vch"><div class="av" style="background:${v.c}">${v.i}</div><div><div class="vname" onclick="renV(${i})">${esc(v.nom)}</div><div class="vmarge">${eur(mg)} marge</div></div></div>
    <div class="vsg">${t(vm.length,'COMMANDES',vm.length?'pos':'')}${t(g('fi'),'FI')}${t(ca>0?eur(ca):'—','DÉCAISS. FI','sm')}${t(g('mad'),'MAD')}${t(g('coyote'),'COYOTE')}${t(g('protech'),'PROTECH')}${t(g('bulbee'),'BULBEE')}${t(g('euro'),'EURODATA')}${t(g('reprise'),'REPRISES')}${t(gt('VN'),'VN')}${t(gt('VD'),'VD')}${t(gt('VK'),'VK')}</div>${nextLiv(i)}</div>`;
  }).join('');
}
function rCumul(){
  const vm=allCde(),g=k=>vm.filter(x=>x[k]).length,gt=k=>vm.filter(x=>(x.type||'VN')===k).length,go=k=>vm.filter(x=>(x.origine||'STOCK')===k).length,ca=vm.filter(x=>x.fi).reduce((s,x)=>s+(x.ca||0),0);
  const it=[{v:vm.length,l:'COMMANDES'},{v:vm.filter(x=>x.myana==='valide').length,l:'MY ANA OK'},{v:g('mad'),l:'MAD'},
    {v:g('fi'),l:'FI',sub:'IP FI '+(vm.length?Math.round(g('fi')/vm.length*100)+' %':'—')},{v:ca>0?eur(ca):'—',l:'DÉCAISS. FI',sm:1},
    {v:g('coyote'),l:'COYOTE'},{v:g('protech'),l:'PROTECH'},{v:g('bulbee'),l:'BULBEE'},{v:g('euro'),l:'EURODATACAR'},{v:g('reprise'),l:'REPRISES'},{v:gt('VN'),l:'VN'},{v:gt('VD'),l:'VD'},{v:gt('VK'),l:'VK'},{v:go('STOCK'),l:'STOCK'},{v:go('APPRO'),l:'APPRO'}];
  $('cgrid').innerHTML=it.map((x,k)=>`<div class="cs c${k}"><div class="csv" style="${x.sm?'font-size:12px':''}">${x.v}</div><div class="csl">${x.l}</div><div class="css">${x.sub||'ce mois'}</div></div>`).join('');
}
function rVentes(){
  $('vsecs').innerHTML=vOrd().map(vi=>{const v=S.v[vi];
    const vm=vCde(vi),an=vAnn(vi),mg=vm.reduce((s,x)=>s+(x.marge||0),0);
    const all=v.ventes.filter(x=>inM(x));
    const rows=all.map(vt=>{
      const gi=v.ventes.indexOf(vt),ann=isAnn(vt);
      const mb=!vt.marge?'<span class="mb mbz">0€</span>':vt.marge<0?`<span class="mb mbn">${eur(vt.marge)}</span>`:`<span class="mb mbp">${eur(vt.marge)}</span>`;
      const my=ann?'<span class="sx">❌ Annulée</span>':vt.myana==='valide'?'<span class="sv">✓ Validé</span>':vt.myana==='attente'?'<span class="sa">⏳ Attente</span>':'<span class="sn">—</span>';
      return`<tr${ann?' class="rann"':''}><td><span class="dot${vt.facture?'':' p'}"></span>${esc(vt.date)||'—'}</td><td><b>${esc(vt.modele)||'—'}</b> <span class="sv" style="font-size:9px">${vt.type||'VN'}</span> <span class="sa" style="font-size:9px">${vt.origine||'STOCK'}</span></td><td style="font-family:monospace;font-size:10px;color:#999">${esc(vt.immat)||'—'}</td><td>${esc(vt.client)||'—'}</td><td>${mb}</td><td>${vt.ca>0?'<b>'+eur(vt.ca)+'</b>':'<span class="sn">—</span>'}</td><td>${my}</td><td>${vt.facture?'<span class="sv">Oui</span>':'<span class="sn">—</span>'}</td><td>${livCell(vt)}</td><td><button class="bmod" onclick="oEdit(${vi},${gi})">Modifier</button></td></tr>`;
    }).join('');
    const nA=an.length?`<span style="color:#B91C1C">${an.length} annulée${an.length>1?'s':''}</span>`:'';
    return`<div class="vsec"><div class="vsh"><div class="av" style="background:${v.c};width:28px;height:28px;font-size:10px">${v.i}</div><b style="font-size:13px">${esc(v.nom)}</b><div class="vshst">${nA}<span>${eur(mg)}</span><span>${vm.length} véh.</span></div><button class="badd" onclick="oAdd(${vi})">+ Ajouter</button></div>${all.length?`<table class="vtbl"><thead><tr><th>DATE</th><th>MODÈLE</th><th>IMMAT</th><th>CLIENT</th><th>MARGE</th><th>FINANCÉ</th><th>MY ANA</th><th>FACTURÉ</th><th>LIVRAISON</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="emsg">Aucune commande ce mois</div>'}</div>`;
  }).join('');
}
function renV(i){alert('Les noms des vendeurs sont fixés dans le fichier (liste VD).');}
const CK={xfi:'fi',xma:'mad',xbu:'bulbee',xco:'coyote',xpr:'protech',xeu:'euro',xre:'reprise'};
function fillForm(vt){
  $('fd').value=vt.date||'';setModele(vt.modele);$('fliv').value=vt.date_livraison||'';$('fi2').value=vt.immat||'';$('fcl').value=vt.client||'';
  $('fmg').value=vt.marge||'';$('fca').value=vt.ca||'';$('fmy').value=vt.myana||'';$('ffa').value=vt.facture?'oui':'';$('fan').value=vt.annule?'annule':vt.livre?'livre':'';$('ftp').value=vt.type||'VN';$('for').value=vt.origine||'STOCK';
  for(const id in CK)$(id).checked=!!vt[CK[id]];
}
function oAdd(vi){$('evi').value=vi;$('eidx').value='';fillForm({});$('fd').value=new Date().toLocaleDateString('fr-FR');$('mtit').textContent='Ajouter — '+S.v[vi].nom;$('bdel').style.display='none';$('ov').classList.add('open');}
function oEdit(vi,idx){$('evi').value=vi;$('eidx').value=idx;fillForm(S.v[vi].ventes[idx]);$('mtit').textContent='Modifier — '+S.v[vi].nom;$('bdel').style.display='';$('ov').classList.add('open');}
function cov(){$('ov').classList.remove('open');}
function rebuild(){S.v.forEach(v=>v.ventes=[]);orders.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(o=>{if(S.v[o.vi])S.v[o.vi].ventes.push(o);});}
function toRow(o){const{_id,vi,id,...r}=o;return{...r,vendeur:S.v[o.vi].nom};}
async function wAdd(o){await sb('',{method:'POST',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify(toRow(o))});await refresh();}
async function wSet(id,o){await sb('?id=eq.'+id,{method:'PATCH',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify(toRow(o))});await refresh();}
async function wDel(id){await sb('?id=eq.'+id,{method:'DELETE'});await refresh();}
async function savV(){
  const vi=+$('evi').value,idx=$('eidx').value;
  const o={date:$('fd').value.trim(),modele:$('fm').value.trim(),immat:$('fi2').value.trim().toUpperCase(),client:$('fcl').value.trim(),
    marge:parseFloat($('fmg').value)||0,ca:parseFloat($('fca').value)||0,myana:$('fmy').value,facture:$('ffa').value==='oui',annule:$('fan').value==='annule',livre:$('fan').value==='livre',date_livraison:$('fliv').value||null,type:$('ftp').value,origine:$('for').value,vi,mois:S.mois,annee:S.annee,ts:Date.now()};
  for(const id in CK)o[CK[id]]=$(id).checked;
  try{
    if(idx!==''){const old=S.v[vi].ventes[+idx];o.mois=old.mois;o.annee=old.annee;o.ts=old.ts||o.ts;await wSet(old._id,o);}else await wAdd(o);
    cov();
  }catch(e){alert('Enregistrement impossible : '+(e.message||e.code||e));}
}
async function delV(){
  const vi=+$('evi').value,idx=+$('eidx').value;if(!confirm('Supprimer cette commande ?'))return;
  try{await wDel(S.v[vi].ventes[idx]._id);cov();}catch(e){alert('Suppression impossible : '+(e.message||e.code||e));}
}
function setSt(t){$('sst').textContent=t;}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const plain=()=>orders.map(({_id,vi,...r})=>r);
function autoBackup(){try{const t=new Date().toISOString().slice(0,10);if(!orders.length||localStorage.getItem('geely_vn_bk')===t)return;localStorage.setItem('geely_vn_bk',t);dl('Geely_VN_sauvegarde_'+t+'.json',JSON.stringify(plain()),'application/json');setSt('Sauvegarde du jour téléchargée (dossier Téléchargements)');}catch(e){}}
function exportCsv(){
  const cols=['vendeur','date','modele','immat','client','type','origine','marge','ca','myana','date_livraison','livre','facture','annule','fi','mad','bulbee','coyote','protech','euro','reprise','mois','annee'];
  const q=v=>{v=v===true?'Oui':v===false?'':v==null?'':String(v);return '"'+v.replace(/"/g,'""')+'"';};
  const csv='\uFEFF'+cols.join(';')+'\n'+plain().map(r=>cols.map(c=>q(r[c])).join(';')).join('\n');
  dl('Geely_VN_commandes_'+new Date().toISOString().slice(0,10)+'.csv',csv,'text/csv;charset=utf-8');
}
async function restore(inp){
  const file=inp.files[0];inp.value='';if(!file)return;
  try{
    const rows=JSON.parse(await file.text());if(!Array.isArray(rows))throw new Error('fichier non valide');
    const have=new Set(plain().map(r=>[r.ts,r.immat,r.vendeur].join('|')));
    const add=rows.filter(r=>!have.has([r.ts,r.immat,r.vendeur].join('|'))).map(({id,...r})=>r);
    if(!add.length){alert('Rien à restaurer : toutes les commandes du fichier sont déjà présentes.');return;}
    if(!confirm('Restaurer '+add.length+' commande(s) manquante(s) ?'))return;
    await sb('',{method:'POST',headers:{...SB_H,'Prefer':'return=minimal'},body:JSON.stringify(add)});
    await refresh();alert(add.length+' commande(s) restaurée(s).');
  }catch(e){alert('Restauration impossible : '+e.message);}
}
async function refresh(){
  const rows=await sb('?select=*&order=id');
  orders=rows.map(r=>({...r,_id:r.id,vi:S.v.findIndex(v=>v.nom===r.vendeur)}));rebuild();render();
  setSt('Synchronisé à '+new Date().toLocaleTimeString('fr-FR'));
  if(!window._bk){window._bk=1;autoBackup();}
}
async function initStore(){
  try{await refresh();}catch(e){setSt('⚠️ Connexion impossible : '+e.message);}
  setInterval(async()=>{if(document.hidden||$('ov').classList.contains('open'))return;try{await refresh();}catch(e){setSt('⚠️ Hors ligne');}},SYNC_MS);
}
const fmtD=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const dDiff=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
function livState(vt){if(vt.livre)return{c:'ok',t:'Livrée'};if(vt.facture)return{c:'ok',t:'Facturée'};const n=dDiff(vt.date_livraison);if(n<0)return{c:'late',t:'Retard '+(-n)+' j'};if(n===0)return{c:'soon',t:'Aujourd’hui'};if(n<=7)return{c:'soon',t:'Dans '+n+' j'};return{c:'ok',t:'Dans '+n+' j'};}
function livCell(vt){if(!vt.date_livraison)return'<span class="sn">—</span>';const s=livState(vt);return`<span class="lv ${s.c}" title="${s.t}">${fmtD(vt.date_livraison)}</span> <small style="color:#999;font-size:10px">${s.t}</small>`;}
const livList=vi=>S.v.flatMap((v,i)=>(vi==null||vi===i)?v.ventes.map(x=>({...x,_v:v})):[]).filter(x=>x.date_livraison&&!isAnn(x)&&!x.livre&&!x.facture).sort((a,b)=>a.date_livraison.localeCompare(b.date_livraison));
function nextLiv(i){const l=livList(i);if(!l.length)return'<div class="vliv">📅 Aucune livraison prévue</div>';const x=l[0],s=livState(x);return`<div class="vliv ${s.c}">📅 Prochaine livraison : <b>${fmtD(x.date_livraison)}</b> · ${esc(x.modele)||'—'} · ${s.t}</div>`;}
function rLiv(){const l=livList().slice(0,16);$('livgrid').innerHTML=l.length?l.map(x=>{const s=livState(x);return`<div class="liv ${s.c}"><div class="lvd">${fmtD(x.date_livraison)}</div><div><b>${esc(x.modele)||'—'}</b> · ${esc(x.client)||'—'}<br><small>${esc(x._v.nom)} · ${s.t}</small></div></div>`;}).join(''):'<div class="emsg" style="padding:14px">Aucune livraison estimée à venir</div>';}
function setModele(v){const s=$('fm');[...s.options].forEach(o=>{if(o.dataset.x)o.remove();});if(v&&![...s.options].some(o=>o.value===v)){const o=new Option(v,v);o.dataset.x=1;s.add(o);}s.value=v||s.options[0].value;}
const MODELES=['E2','E5','STARRAY','MONJARO'],MCOL=['#1B2D5B','#2D7A4F','#C0392B','#E67E22','#999'];
function rMod(){
  const vm=allCde(),cnt={};MODELES.forEach(m=>cnt[m]=0);let autres=0;
  vm.forEach(x=>{const m=String(x.modele||'').trim().toUpperCase();if(m in cnt)cnt[m]++;else autres++;});
  const rows=MODELES.map((m,k)=>[m,cnt[m],MCOL[k]]);if(autres)rows.push(['AUTRES',autres,MCOL[4]]);
  const max=Math.max(1,...rows.map(r=>r[1]));
  $('vgrid').insertAdjacentHTML('beforeend',`<div class="vc"><div class="vch"><div class="av" style="background:#6B4FA0">📊</div><div><div style="font-weight:700;font-size:13px">MODÈLES VENDUS</div><div class="vmarge">${MN[S.mois]} · ${vm.length} commande${vm.length>1?'s':''}</div></div></div><div class="mrows">${rows.map(r=>`<div class="mrow"><span class="mn">${r[0]}</span><div class="mbar"><i style="width:${Math.round(r[1]/max*100)}%;background:${r[2]}"></i></div><b>${r[1]}</b></div>`).join('')}</div></div>`);
}
function render(){rTop();rCards();rMod();rCumul();rLiv();rVentes();}
render();initStore();
</script>
</body>
